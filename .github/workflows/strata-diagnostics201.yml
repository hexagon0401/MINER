name: MINER Diagnostics 2.0.1 and Preview 2 delivery repair
on:
  push:
    branches: ['codex/strata-diagnostics-201']
    paths: ['v5/diagnostics/**', 'v5/tests/test_diagnostic*.py', 'v5/tests/test_strata_assessment.py', 'packaging/diagnostics201/**', '.github/workflows/strata-diagnostics201.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miner-diagnostics-201
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macOS-AppleSilicon
          - runner: macos-15-intel
            platform: macOS-Intel
          - runner: windows-2025
            platform: Windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3 certifi==2026.10.23
      - name: Privacy and restoration regression tests
        working-directory: v5
        run: |
          python -m unittest discover -s tests -p "test_diagnostic*.py" -v
          python -m unittest discover -s tests -p test_strata_assessment.py -v
          python -m unittest discover -s tests -p test_warp.py -v
      - name: Package and execute standalone read-only recorder
        working-directory: v5
        shell: bash
        run: |
          set -o pipefail
          python diagnostics/build.py 2>&1 | tee "$RUNNER_TEMP/diagnostics-release-build.log"
      - name: Bounded failure diagnostics
        if: failure()
        run: python packaging/icons/annotate_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-v201-${{ matrix.platform }}
          path: v5/dist-diagnostics/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: diagnostics-v201-*
          merge-multiple: true
          path: diagnostics-assets
      - name: Verify all native receipts
        run: |
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'v5')
          from diagnostics.collect import VERSION
          for kind in ['macOS-AppleSilicon','macOS-Intel','Windows-x64']:
              p=Path('diagnostics-assets')/f'MINER-Diagnostics-v{VERSION}-{kind}.zip'
              d=json.loads(p.with_suffix('.zip.verification.json').read_text())
              assert d['ok'] and d['packaged_recorder_executed'] and d['read_only_report_verified']
              assert d['tool_version']==VERSION
              if kind.startswith('macOS'):assert d['native_long_path_identity_fixture'] is True
              assert d['source_commit']==os.environ['GITHUB_SHA']
              assert d['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          PY
      - name: Read diagnostic version
        id: version
        run: |
          python3 - <<'PYVERSION'
          import os,sys
          sys.path.insert(0,'v5')
          from diagnostics.collect import VERSION
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('value='+VERSION+'\n')
          PYVERSION
      - name: Publish separate diagnostics prerelease, preserving stable MINER and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create miner-diagnostics-v${{ steps.version.outputs.value }} --target "$GITHUB_SHA" --draft --prerelease --title 'MINER Local Diagnostics v${{ steps.version.outputs.value }}' --notes-file packaging/diagnostics201/RELEASE_NOTES.md
          gh release upload miner-diagnostics-v${{ steps.version.outputs.value }} diagnostics-assets/*
          gh release edit miner-diagnostics-v${{ steps.version.outputs.value }} --draft=false --prerelease=true --latest=false
  repair-preview2-documents:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore only the missing Preview 2 test documents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYREPAIR'
          import json,subprocess
          tag='miner-strata-v2.0.0-preview.2'
          def metadata():return json.loads(subprocess.check_output(['gh','api','repos/hexagon0401/MINER/releases/tags/'+tag]))
          before=metadata()
          assert before['prerelease'] and before['target_commitish'].startswith('0989f00')
          documents={'MACBOOK_TEST_KO.md','STRATA_TEST_RESULTS.csv'}
          protected={a['name']:(a['id'],a.get('digest')) for a in before['assets'] if a['name'] not in documents}
          subprocess.run(['gh','release','upload',tag,'--clobber','docs/strata/MACBOOK_TEST_KO.md','docs/strata/STRATA_TEST_RESULTS.csv'],check=True)
          after=metadata();assets={a['name']:a for a in after['assets']}
          assert documents.issubset(assets)
          assert all((assets[name]['id'],assets[name].get('digest'))==value for name,value in protected.items())
          print(json.dumps({'test_documents_restored':True,'all_other_release_assets_unchanged':True}))
          PYREPAIR
