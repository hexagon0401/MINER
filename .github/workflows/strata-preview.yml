name: STRATA Preview native packages
on:
  push:
    branches: ['codex/strata-2.0-g0-g1']
    paths:
      - 'v5/**'
      - '.github/workflows/strata-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miner-strata-preview
  cancel-in-progress: true
jobs:
  windows-scm:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3 pywin32==311
      - name: Fast isolated SCM and lifetime gates
        working-directory: v5
        shell: python
        run: |
          import os,sys,subprocess,json,traceback
          sys.excepthook=lambda *exc: print('::error::'+''.join(traceback.format_exception(*exc))[-5000:].replace('%','%25').replace('\n','%0A'))
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          root=Path(os.environ['ProgramFiles'])/'MINER-SCM-CI';root.mkdir()
          work=Path(os.environ['RUNNER_TEMP'])/'strata-scm-fast';work.mkdir()
          entry=work/'service-entry.py'
          entry.write_text("import sys\nfrom windows.strata_service import host,install,maintenance\nif '--strata-service' in sys.argv: host()\nelif '--strata-install' in sys.argv: install()\nelif '--strata-maintenance' in sys.argv: maintenance('--remove-service' in sys.argv)\nelse: raise SystemExit(2)\n")
          subprocess.run([sys.executable,'-m','PyInstaller','--noconfirm','--clean','--onedir','--console','--name','MINER','--paths',str(Path.cwd()),'--hidden-import','win32timezone','--distpath',str(root),'--workpath',str(work/'build'),'--specpath',str(work),str(entry)],check=True,timeout=300)
          from windows.service_smoke import run
          from windows.service_lifetime_smoke import run as lifetime
          report={'packaged_boundary':run(root/'MINER/MINER.exe'),'lifetime':lifetime(root,work)}
          print(json.dumps(report),flush=True)
      - name: Annotate native failure
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          for p in (Path(os.environ['LOCALAPPDATA'])/'MINER/Beta1/startup-error.log',Path(os.environ['SystemRoot'])/'System32/config/systemprofile/AppData/Local/MINER/Beta1/startup-error.log'):
              if p.exists():print('::error::'+p.read_text(errors='replace')[-4000:].replace('%','%25').replace('\n','%0A'))
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MINER_RELEASE_CHANNEL: beta
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies and engine
        working-directory: source/v5
        run: |
          python3 -m pip install pyinstaller==6.22.3 certifi==2026.10.23 dmgbuild==1.6.7
          python3 install_engine.py
      - name: Import Developer ID if configured
        id: signing
        working-directory: source/v5
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_CONFIGURED: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 != '' || secrets.APPLE_NOTARY_KEY_ID != '' || secrets.APPLE_NOTARY_ISSUER_ID != '' }}
        run: python3 macos/signing_credentials.py
      - name: Test and package native DMG
        working-directory: source/v5
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -o pipefail
          export SCHOOLNET_TEST_ENGINE="$PWD/local/bin/sing-box"
          python3 -c 'import subprocess,sys; subprocess.run([sys.executable,"-m","unittest","discover","-s","tests","-v"],check=True,timeout=180)' 2>&1 | tee "$RUNNER_TEMP/strata-release-tests-${{ matrix.arch }}.log"
          if [ "$SIGNING_ENABLED" = true ]; then mode=developer-id; else mode=adhoc; fi
          python3 macos/build.py --dmg-background macos/design/dmg-background.png --arch '${{ matrix.arch }}' --signing "$mode" 2>&1 | tee "$RUNNER_TEMP/strata-release-build-${{ matrix.arch }}.log"
      - name: Package read-only diagnostics
        working-directory: source/v5
        run: python3 diagnostics/build.py
      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        working-directory: source/v5
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: python3 macos/signing_credentials.py --cleanup "$SIGNING_KEYCHAIN"
      - name: Annotate failure diagnostics
        if: failure()
        run: python3 automation/packaging/icons/annotate_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-release-macos-${{ matrix.arch }}
          path: |
            source/v5/dist/*
            source/v5/dist-diagnostics/*
            ${{ runner.temp }}/strata-release-*.log
            ${{ runner.temp }}/miner-ui-${{ matrix.arch }}*
  windows:
    needs: windows-scm
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      MINER_RELEASE_CHANNEL: beta
      QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.8.3 pyinstaller==6.22.3 certifi==2026.10.23 Pillow==11.3.0 pywin32==311
      - name: Package and exercise installed EXE
        working-directory: source/v5
        run: |
          python windows/build.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/strata-release-build-windows.log"
          exit $LASTEXITCODE
      - name: Package read-only diagnostics
        working-directory: source/v5
        run: python diagnostics/build.py
      - name: Annotate failure diagnostics
        if: failure()
        run: python automation/packaging/icons/annotate_failure.py
      - name: Annotate packaged UI failure
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          for p in (Path(os.environ['RUNNER_TEMP'])/'miner-windows-diagnostics').rglob('*error.log'):
              print('::error::'+(str(p)+'\n'+p.read_text(errors='replace')[-4000:]).replace('%','%25').replace('\n','%0A'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-release-windows
          path: |
            source/v5/dist-diagnostics/*
            source/v5/dist-windows/*Setup.exe
            source/v5/dist-windows/*.sha256
            source/v5/dist-windows/*.verification.json
            ${{ runner.temp }}/strata-release-build-windows.log
            ${{ runner.temp }}/miner-windows-diagnostics/**
  publish:
    needs: [macos, windows, windows-scm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: strata-release-*
          path: platform-assets
      - name: Validate all native receipts
        run: python3 packaging/strata-preview/assemble.py platform-assets release-assets
      - name: Publish isolated STRATA preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create miner-strata-v2.0.0-preview.1 --target "$GITHUB_SHA" --draft --prerelease --title 'MINER STRATA 2.0.0 Preview 1' --notes-file packaging/strata-preview/RELEASE_NOTES.md
          gh release upload miner-strata-v2.0.0-preview.1 release-assets/* docs/strata/MACBOOK_TEST_KO.md docs/strata/STRATA_TEST_RESULTS.csv
          gh release edit miner-strata-v2.0.0-preview.1 --draft=false --prerelease=true --latest=false
