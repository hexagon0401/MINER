name: Compile official MINER icon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v5/macos/design/icons/stable/MINER.icon/**'
      - 'packaging/icons/compile_macos.py'
      - '.github/workflows/miner-icon-compile.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Icon Composer source
        run: python3 packaging/icons/compile_macos.py v5/macos/design/icons/stable/MINER.icon compiled-icon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-miner-icon
          path: compiled-icon/
          if-no-files-found: warn
