name: MINER Windows Beta 1
on:
  push:
    tags: ['v5.0.0-beta.1.1-windows.*']
  pull_request:
    branches: [main]
    paths: ["v5/windows/**", "v5/schoolnet/**", "v5/tests/**", ".github/workflows/miner-windows.yml"]
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.8.3 pyinstaller==6.22.3 certifi==2026.10.23 Pillow==11.3.0
      - name: Portable tests
        working-directory: v5
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-tests.log"
          exit $LASTEXITCODE
      - name: Build and verify Windows package
        working-directory: v5
        run: |
          python windows/build.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-build.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: |
            ${{ runner.temp }}/miner-windows-diagnostics/**
            v5/windows/work/tun-smoke.log
            ${{ runner.temp }}/windows-tests.log
            ${{ runner.temp }}/windows-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            v5/dist-windows/*Setup.exe
            v5/dist-windows/*.sha256
            v5/dist-windows/*.verification.json
            v5/dist-windows/*Screenshots.zip
            v5/dist-windows/*Preview.gif
            v5/dist-windows/*.png
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --prerelease --title 'MINER BETA 1 — Windows' --notes-file v5/windows/RELEASE_NOTES.md
  report:
    if: always() && github.ref_type == 'tag'
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-diagnostics
          path: ${{ runner.temp }}/miner-build-report
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPORT_DIR: ${{ runner.temp }}/miner-build-report
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python3 v5/macos/ci_report.py
      - env:
          REPORT_DIR: ${{ runner.temp }}/miner-build-report
          REPORT_REF: miner-windows-status/${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git switch --orphan "$REPORT_REF"
          cp -r "$REPORT_DIR"/* .
          git config user.name 'MINER Build Reports'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Record Windows native build verification'
          git push origin "HEAD:refs/heads/$REPORT_REF"
