name: MINER macOS DMG

on:
  push:
    branches: [main, v5-alpha]
    tags: ['v5.0.0-alpha.*', 'v5.0.0-delta.*']
    paths: ['v5/**', '.github/workflows/v5-alpha-macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolnet-v5-alpha-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # Delta prioritizes the user's Apple Silicon Mac. Alpha retains both.
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v5.0.0-delta.') && '[{"runner":"macos-26","arch":"arm64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager and checksum-verified engine
        working-directory: v5
        run: |
          python -m pip install 'pyinstaller==6.22.3' 'certifi==2026.10.23' 'dmgbuild==1.6.7'
          python install_engine.py
      - name: Run portable and native engine checks (no TUN activation)
        working-directory: v5
        run: |
          export SCHOOLNET_TEST_ENGINE="$PWD/local/bin/sing-box"
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/miner-tests-${{ matrix.arch }}.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/miner-tests-${{ matrix.arch }}.log"
          exit "$result"
      - name: Import Developer ID if configured
        id: signing
        working-directory: v5
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_CONFIGURED: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 != '' || secrets.APPLE_NOTARY_KEY_ID != '' || secrets.APPLE_NOTARY_ISSUER_ID != '' }}
        run: python macos/signing_credentials.py
      - name: Build app and verify mounted DMG
        working-directory: v5
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set +e
          if [ "$SIGNING_ENABLED" = true ]; then
            python macos/build.py --arch '${{ matrix.arch }}' --signing developer-id > "$RUNNER_TEMP/miner-build-${{ matrix.arch }}.log" 2>&1
          else
            python macos/build.py --arch '${{ matrix.arch }}' --signing adhoc > "$RUNNER_TEMP/miner-build-${{ matrix.arch }}.log" 2>&1
          fi
          result=$?
          cat "$RUNNER_TEMP/miner-build-${{ matrix.arch }}.log"
          exit "$result"
      - name: Retain native test/build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miner-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/miner-tests-${{ matrix.arch }}.log
            ${{ runner.temp }}/miner-build-${{ matrix.arch }}.log
            ${{ runner.temp }}/miner-ui-${{ matrix.arch }}*.png
            ${{ runner.temp }}/miner-ui-${{ matrix.arch }}.json
          if-no-files-found: warn
      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        working-directory: v5
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: python macos/signing_credentials.py --cleanup "$SIGNING_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: schoolnet-macos-${{ matrix.arch }}
          path: v5/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v5.0.0-alpha.') || startsWith(github.ref, 'refs/tags/v5.0.0-delta.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: schoolnet-macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/v5.0.0-delta.') && 'MINER DELTA' || 'MINER Alpha' }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --prerelease --title "$RELEASE_TITLE" \
            --notes-file v5/macos/RELEASE_NOTES.md

  report:
    if: always() && (startsWith(github.ref, 'refs/tags/v5.0.0-alpha.') || startsWith(github.ref, 'refs/tags/v5.0.0-delta.'))
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: miner-diagnostics-*
          path: ${{ runner.temp }}/miner-build-report
          merge-multiple: true
      - name: Collect native build and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPORT_DIR: ${{ runner.temp }}/miner-build-report
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python3 v5/macos/ci_report.py
      - name: Save small report on an isolated Git branch
        env:
          REPORT_DIR: ${{ runner.temp }}/miner-build-report
          REPORT_REF: miner-build-status/${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git switch --orphan "$REPORT_REF"
          cp "$REPORT_DIR"/* .
          git config user.name 'MINER Build Reports'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Record native MINER build and release verification'
          git push origin "HEAD:refs/heads/$REPORT_REF"
