name: SchoolNet v5 Alpha macOS DMG

on:
  push:
    branches: [v5-alpha]
    tags: ['v5.0.0-alpha.*']
    paths: ['v5/**', '.github/workflows/v5-alpha-macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolnet-v5-alpha-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager and checksum-verified engine
        working-directory: v5
        run: |
          python -m pip install 'pyinstaller==6.22.3'
          python install_engine.py
      - name: Run portable and native engine checks (no TUN activation)
        working-directory: v5
        run: |
          export SCHOOLNET_TEST_ENGINE="$PWD/local/bin/sing-box"
          python -m unittest discover -s tests -v
      - name: Build app and verify mounted DMG
        working-directory: v5
        run: python macos/build.py --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: schoolnet-macos-${{ matrix.arch }}
          path: v5/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v5.0.0-alpha.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: schoolnet-macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --prerelease --title "SchoolNet $RELEASE_TAG" \
            --notes-file v5/macos/RELEASE_NOTES.md
